<nav class="sticky top-0 z-50 border-b bg-neutral-900 text-neutral-100 dark:border-neutral-800 dark:bg-neutral-950 light:bg-white light:text-neutral-900 light:border-neutral-200">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 items-center justify-between">
      <!-- Logo / Home link -->
      <div class="flex-shrink-0">
        <a routerLink="/" class="font-bold text-lg hover:opacity-80 transition-opacity">
          <span class="hidden sm:inline">Darshan Kotadiya</span>
          <span class="sm:hidden">DK</span>
        </a>
      </div>

      <!-- Desktop Navigation -->
      <div class="hidden md:flex md:items-center md:space-x-1">
        <a
          *ngFor="let item of navItems"
          [routerLink]="item.route"
          routerLinkActive="opacity-100"
          [routerLinkActiveOptions]="{ exact: item.route === '/' }"
          class="px-3 py-2 text-sm opacity-70 hover:opacity-100 transition-opacity"
        >
          {{ item.label }}
        </a>
      </div>

      <!-- Theme Toggle and Mobile Menu -->
      <div class="flex items-center space-x-3">
        <!-- Theme Toggle -->
        <button
          type="button"
          (click)="cycleTheme()"
          [attr.aria-label]="getThemeTitle()"
          [attr.title]="getThemeTitle()"
          class="group relative flex h-10 w-10 items-center justify-center overflow-hidden rounded-full border border-white/10 bg-white/[0.04] text-neutral-300 transition-all duration-300 ease-out hover:border-blue-400/40 hover:bg-blue-500/10 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400/60"
        >
          <span class="relative flex h-5 w-5 items-center justify-center">
            @if (themeService.themeMode() === 'dark') {
              <svg
                class="h-5 w-5 animate-theme-in"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                aria-hidden="true"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"
                />
              </svg>
            } @else {
              <svg
                class="h-5 w-5 animate-theme-in"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="4" />
                <path
                  stroke-linecap="round"
                  d="M12 2V4M12 20V22M4.93 4.93L6.35 6.35M17.65 17.65L19.07 19.07M2 12H4M20 12H22M4.93 19.07L6.35 17.65M17.65 6.35L19.07 4.93"
                />
              </svg>
            }
          </span>
        </button>

        <!-- Mobile Menu Toggle -->
        <button
          (click)="toggleMobileMenu()"
          [attr.aria-label]="mobileMenuOpen() ? 'Close navigation menu' : 'Open navigation menu'"
          class="md:hidden px-2 py-2 text-lg opacity-70 hover:opacity-100 transition-opacity"
          type="button"
        >
          {{ mobileMenuOpen() ? '✕' : '≡' }}
        </button>
      </div>
    </div>

    <!-- Mobile Navigation Menu -->
    <div
      *ngIf="mobileMenuOpen()"
      class="md:hidden border-t border-neutral-700 dark:border-neutral-700 light:border-neutral-200"
    >
      <div class="space-y-1 px-2 py-3">
        <a
          *ngFor="let item of navItems"
          [routerLink]="item.route"
          (click)="onNavItemClick()"
          routerLinkActive="opacity-100 bg-neutral-800 dark:bg-neutral-800 light:bg-neutral-100"
          [routerLinkActiveOptions]="{ exact: item.route === '/' }"
          class="block px-3 py-2 rounded text-sm opacity-70 hover:opacity-100 transition-opacity"
        >
          {{ item.label }}
        </a>
      </div>
    </div>
  </div>
</nav>
